<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Calculator</title>
</head>
<body>
    <div id="calc">
        <!-- Whole Calculator -->
        
            <!-- The calculator screen -->
            <input type="text" id="screen" readonly value="0">
        
        <div id="buttons">
            <button type="button" class="btn" id="clear">C</button>
            <button type="button" class="btn" id="divid">÷</button>
            <button type="button" class="btn" id="times">×</button>
            <button type="button" class="btn" id="minus">−</button>
            
            <button type="button" class="btn" >7</button>
            <button type="button" class="btn" >8</button>
            <button type="button" class="btn" >9</button>
            <button type="button" class="btn" id="plus">+</button>
            
            <button type="button" class="btn">4</button>
            <button type="button" class="btn">5</button>
            <button type="button" class="btn">6</button>
            
            <button type="button" class="btn">1</button>
            <button type="button" class="btn">2</button>
            <button type="button" class="btn ">3</button>
            <button type="button" class="btn" id="equal">=</button>

            <button type="button" class="btn" id="zero">0</button>
            <button type="button" class="btn" id="decimal">.</button>
        </div>
    </div>
</div>
<script type="module" src="./dist/calc.js"></script>
</body>
</html>
